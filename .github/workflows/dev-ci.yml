name: dev-ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build_test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build Go-MetadiumX
      env:
        CFLAGS: "-Wno-error=unused-parameter"
        CXXFLAGS: "-Wno-error=unused-parameter"
      run: make metadium
    - name: Check Build
      run: ls -al build/metadium.tar.gz

  lint_test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Check Lint
      run: make lint

  unit_test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Check golang Test Cases
      run: |
        unset ANDROID_HOME
        make test-short
