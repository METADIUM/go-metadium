networks:
  gmet-s36-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24

x-common: &common
  restart: unless-stopped
  networks:
    - gmet-s36-net

services:
  node1:
    <<: *common
    image: ${NODE1_IMAGE:-gmet-s36-leveldb:latest}
    container_name: gmet-s36-node1
    hostname: gmet-s36-node1
    volumes:
      - ${GENESIS_FILE:-./genesis.json}:/data/genesis.json:ro
      - ./data/node1:/data/geth
    ports:
      - "8545:8545"
      - "30403:30303"
      - "30403:30303/udp"
    networks:
      gmet-s36-net:
        ipv4_address: 172.32.0.11
    entrypoint: ["/entrypoint.sh"]
    command: >
      --networkid 1338
      --consensusmethod 2
      --syncmode full
      --gcmode archive
      --mine
      --miner.etherbase 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,admin,miner,txpool,debug,personal
      --http.corsdomain "*"
      --http.vhosts "*"
      --port 30303
      --nat extip:172.32.0.11
      --maxpeers 10
      --verbosity 3
      --userocksdb 0
      --unlock 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      --password /data/geth/password.txt
      --allow-insecure-unlock
      --rpc.txfeecap 0

  node2:
    <<: *common
    image: ${NODE2_IMAGE:-gmet-s36-rocksdb:latest}
    container_name: gmet-s36-node2
    hostname: gmet-s36-node2
    depends_on:
      - node1
    volumes:
      - ${GENESIS_FILE:-./genesis.json}:/data/genesis.json:ro
      - ./data/node2:/data/geth
    ports:
      - "8546:8545"
      - "30404:30303"
      - "30404:30303/udp"
    networks:
      gmet-s36-net:
        ipv4_address: 172.32.0.12
    entrypoint: ["/entrypoint.sh"]
    command: >
      --networkid 1338
      --consensusmethod 2
      --syncmode full
      --gcmode archive
      --mine
      --miner.etherbase 0x70997970C51812dc3A010C7d01b50e0d17dc79C8
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,admin,miner,txpool,debug
      --http.corsdomain "*"
      --http.vhosts "*"
      --port 30303
      --nat extip:172.32.0.12
      --maxpeers 10
      --verbosity 3
      --userocksdb ${NODE2_USEROCKSDB:-1}
      --unlock 0x70997970C51812dc3A010C7d01b50e0d17dc79C8
      --password /data/geth/password.txt
      --allow-insecure-unlock
      --rpc.txfeecap 0

  node3:
    <<: *common
    image: ${NODE3_IMAGE:-gmet-s36-leveldb:latest}
    container_name: gmet-s36-node3
    hostname: gmet-s36-node3
    depends_on:
      - node1
    volumes:
      - ${GENESIS_FILE:-./genesis.json}:/data/genesis.json:ro
      - ./data/node3:/data/geth
    ports:
      - "8547:8545"
      - "30405:30303"
      - "30405:30303/udp"
    networks:
      gmet-s36-net:
        ipv4_address: 172.32.0.13
    entrypoint: ["/entrypoint.sh"]
    command: >
      --networkid 1338
      --consensusmethod 2
      --syncmode full
      --gcmode archive
      --mine
      --miner.etherbase 0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,admin,miner,txpool,debug
      --http.corsdomain "*"
      --http.vhosts "*"
      --port 30303
      --nat extip:172.32.0.13
      --maxpeers 10
      --verbosity 3
      --userocksdb 0
      --unlock 0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      --password /data/geth/password.txt
      --allow-insecure-unlock
      --rpc.txfeecap 0

  node4:
    <<: *common
    image: ${NODE4_IMAGE:-gmet-s36-rocksdb:latest}
    container_name: gmet-s36-node4
    hostname: gmet-s36-node4
    depends_on:
      - node1
    volumes:
      - ${GENESIS_FILE:-./genesis.json}:/data/genesis.json:ro
      - ./data/node4:/data/geth
