      - "8548:8545"
      - "30406:30303"
      - "30406:30303/udp"
    networks:
      gmet-s36-net:
        ipv4_address: 172.32.0.14
    entrypoint: ["/entrypoint.sh"]
    command: >
      --networkid 1338
      --consensusmethod 2
      --syncmode full
      --gcmode archive
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,admin,debug
      --http.corsdomain "*"
      --http.vhosts "*"
      --port 30303
      --nat extip:172.32.0.14
      --maxpeers 10
      --verbosity 3
      --userocksdb ${NODE4_USEROCKSDB:-1}
      --rpc.txfeecap 0
