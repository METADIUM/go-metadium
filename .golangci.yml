# This file configures github.com/golangci/golangci-lint.

run:
  timeout: 20m
  tests: true
  # default is true. Enables skipping of directories:
  #   vendor$, third_party$, testdata$, examples$, Godeps$, builtin$
  skip-dirs-use-default: true
  skip-files:
    - core/genesis_alloc.go
    - metadium/governance_abi.go
    - metadium/governance_legacy_abi.go

linters:
  disable-all: true
  enable:
    - goimports
    - gosimple
    - govet
    - ineffassign
    - misspell
    - unconvert
    - typecheck
    - unused
    - staticcheck
    - bidichk
    - durationcheck
    - exportloopref
    - whitespace

    # - structcheck # lots of false positives
    # - errcheck #lot of false positives
    # - contextcheck
    # - errchkjson # lots of false positives
    # - errorlint # this check crashes
    # - exhaustive # silly check
    # - makezero # false positives
    # - nilerr # several intentional

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-rules:
    - path: crypto/bn256/cloudflare/optate.go
      linters:
        - deadcode
        - staticcheck
    - path: internal/build/pgp.go
      text: 'SA1019: "golang.org/x/crypto/openpgp" is deprecated: this package is unmaintained except for security fixes.'
    - path: core/vm/contracts.go
      text: 'SA1019: "golang.org/x/crypto/ripemd160" is deprecated: RIPEMD-160 is a legacy hash and should not be used for new applications.'
    - path: accounts/usbwallet/trezor.go
      text: 'SA1019: "github.com/golang/protobuf/proto" is deprecated: Use the "google.golang.org/protobuf/proto" package instead.'
    - path: accounts/usbwallet/trezor/
      text: 'SA1019: "github.com/golang/protobuf/proto" is deprecated: Use the "google.golang.org/protobuf/proto" package instead.'
    # Metadium-specific code paths - keep all unused symbols (intentionally retained)
    - path: ^metadium/
      linters:
        - unused
        - staticcheck
        - whitespace
    - path: ^miner/
      linters:
        - unused
        - staticcheck
        - whitespace
    - path: ^msgq/
      linters:
        - unused
    - path: ^cmd/dbbench/
      linters:
        - staticcheck
    - path: ^eth/protocols/eth/metadium_handlers\.go
      linters:
        - staticcheck
    # Upstream go-ethereum code with intentionally-retained helpers
    - path: ^core/types/hashing\.go
      linters:
        - unused
    - path: ^core/vm/gas_table\.go
      linters:
        - unused
    - path: ^consensus/clique/clique\.go
      linters:
        - unused
    - path: ^internal/ethapi/
      linters:
        - unused
    - path: ^eth/protocols/eth/dispatcher\.go
      linters:
        - unused
    - path: ^eth/peerset\.go
      linters:
        - unused
    - path: ^p2p/discover/table\.go
      linters:
        - unused
    - path: ^core/state/snapshot/dangling\.go
      linters:
        - staticcheck
    - path: ^core/txpool/legacypool/legacypool\.go
      linters:
        - unused
  exclude:
    - 'SA1019: event.TypeMux is deprecated: use Feed'
    - 'SA1019: strings.Title is deprecated'
    - 'SA1019: strings.Title has been deprecated since Go 1.18 and an alternative has been available since Go 1.0: The rule Title uses for word boundaries does not handle Unicode punctuation properly. Use golang.org/x/text/cases instead.'
    - 'SA1029: should not use built-in type string as key for value'
