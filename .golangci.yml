version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bidichk
    - durationcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    staticcheck:
      # golangci-lint v2 folds gosimple and stylecheck into staticcheck. The
      # v1 config enabled staticcheck and gosimple only, so keep that scope:
      # SA* and S* run, the stylecheck (ST*) and quickfix (QF*) families do not.
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        path: crypto/bn256/cloudflare/optate.go
      - path: internal/build/pgp.go
        text: 'SA1019: golang.org/x/crypto/openpgp is deprecated'
      - path: core/vm/contracts.go
        text: 'SA1019: golang.org/x/crypto/ripemd160 is deprecated'
      - path: accounts/usbwallet/trezor
        text: 'SA1019: github.com/golang/protobuf/proto is deprecated'
      # Deprecations this tree has not migrated. staticcheck reports a
      # deprecation only once the module's `go` directive reaches the version
      # that deprecated it, so each toolchain bump turns on a new batch across
      # upstream go-ethereum code: the crypto/elliptic -> crypto/ecdh migration
      # (Go 1.21), the ecdsa key coordinate fields (Go 1.26), runtime.GOROOT
      # (Go 1.24) and go/parser.ParseDir (Go 1.25). These are real changes to
      # crypto, p2p and build internals and do not belong in a toolchain bump;
      # they are deferred deliberately.
      #
      # Scoped to these deprecations rather than disabling SA1019, so any
      # *other* deprecated API still fails the build. Not pinned per file
      # either: the same call appears in several places and the list would go
      # stale.
      - path: (.+)\.go$
        text: 'SA1019: crypto/elliptic\.(Marshal|Unmarshal|GenerateKey) has been deprecated since Go 1.21'
      - path: (.+)\.go$
        text: 'SA1019: \(crypto/elliptic\.Curve\)\.(IsOnCurve|ScalarMult|ScalarBaseMult|Add|Double) has been deprecated since Go 1.21'
      - path: (.+)\.go$
        text: 'SA1019: \(crypto/ecdsa\.(PublicKey|PrivateKey)\)\.(X|Y|D) has been deprecated since Go 1.26'
      - path: (.+)\.go$
        text: 'SA1019: runtime\.GOROOT has been deprecated since Go 1.24'
      - path: (.+)\.go$
        text: 'SA1019: go/parser\.ParseDir has been deprecated since Go 1.25'
      - path: (.+)\.go$
        text: 'SA1019: reflect\.SliceHeader has been deprecated since Go 1.21'
      - linters:
          - staticcheck
          - unused
          - whitespace
        path: ^metadium/
      - linters:
          - staticcheck
          - unused
          - whitespace
        path: ^miner/
      - linters:
          - unused
        path: ^msgq/
      - linters:
          - staticcheck
        path: ^cmd/dbbench/
      - linters:
          - staticcheck
        path: ^eth/protocols/eth/metadium_handlers\.go
      - linters:
          - unused
        path: ^core/types/hashing\.go
      - linters:
          - unused
        path: ^core/vm/gas_table\.go
      - linters:
          - unused
        path: ^consensus/clique/clique\.go
      - linters:
          - unused
        path: ^internal/ethapi/
      - linters:
          - unused
        path: ^eth/protocols/eth/dispatcher\.go
      - linters:
          - unused
        path: ^eth/peerset\.go
      - linters:
          - unused
        path: ^p2p/discover/table\.go
      - linters:
          - staticcheck
        path: ^core/state/snapshot/dangling\.go
      - linters:
          - unused
        path: ^core/txpool/legacypool/legacypool\.go
      - path: (.+)\.go$
        text: 'SA1019: .*event\.TypeMux is deprecated: use Feed'
      - path: (.+)\.go$
        text: 'SA1019: strings.Title is deprecated'
      - path: (.+)\.go$
        text: 'SA1019: strings.Title has been deprecated since Go 1.18 and an alternative has been available since Go 1.0: The rule Title uses for word boundaries does not handle Unicode punctuation properly. Use golang.org/x/text/cases instead.'
      - path: (.+)\.go$
        text: 'SA1029: should not use built-in type string as key for value'
    paths:
      - core/genesis_alloc.go
      - metadium/governance_abi.go
      - metadium/governance_legacy_abi.go
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - core/genesis_alloc.go
      - metadium/governance_abi.go
      - metadium/governance_legacy_abi.go
      - third_party$
      - builtin$
      - examples$
